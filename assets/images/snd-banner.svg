<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="SND Media Official Channel Banner — Where Students Lead Media">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#F5B800" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bannerBg)"/>
  <rect width="1200" height="220" fill="url(#centerGlow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#F5B800" opacity="0.45"/>
  <rect x="0" y="218" width="1200" height="2" fill="#F5B800" opacity="0.45"/>

  <!-- Left Pillar 1: NEWS (Handheld Reporter Mic with NEWS cube) -->
  <g transform="translate(46, 36)">
    <!-- Reporter Mic Icon -->
    <g fill="none" stroke="#F5B800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="14" r="9" fill="#F5B800"/>
      <rect x="11" y="21" width="26" height="12" rx="2" fill="#05070d" stroke="#F5B800"/>
      <text x="24" y="30" text-anchor="middle" fill="#F5B800" stroke="none" font-family="Arial, sans-serif" font-size="8" font-weight="900">NEWS</text>
      <rect x="20" y="33" width="8" height="18" rx="2" fill="#F5B800"/>
      <path d="M24 51 C24 62, 42 62, 42 46"/>
    </g>
    <text x="52" y="22" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">NEWS</text>
    <text x="52" y="38" fill="#CBD5E1" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5">Real Stories, Real Impact.</text>
  </g>

  <!-- Left Pillar 2: PODCAST (Boom Arm Studio Mic + Waves) -->
  <g transform="translate(46, 126)">
    <g fill="none" stroke="#F5B800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="14" width="11" height="19" rx="5.5" transform="rotate(-25 19 23)" fill="#F5B800"/>
      <path d="M12 31 C15 41, 29 38, 30 28"/>
      <path d="M24 38 L37 56 L12 56"/>
      <path d="M5 18 Q2 23 5 28" stroke="#F5B800" opacity="0.85"/>
      <path d="M34 10 Q38 15 35 21" stroke="#F5B800" opacity="0.85"/>
    </g>
    <text x="52" y="22" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">PODCAST</text>
    <text x="52" y="38" fill="#CBD5E1" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5">Ideas, Voices, Conversations.</text>
  </g>

  <!-- Center Focal Title: SND MEDIA + Filigree + Tagline -->
  <g text-anchor="middle">
    <text x="600" y="114" font-family="'Arial Black', 'Impact', 'Segoe UI', sans-serif" font-size="88" font-weight="900" letter-spacing="2">
      <tspan fill="#F5B800">SND</tspan><tspan fill="#FFFFFF"> MEDIA</tspan>
    </text>

    <!-- Symmetrical Gold Filigree Divider -->
    <g transform="translate(600, 134)">
      <line x1="-245" y1="0" x2="-40" y2="0" stroke="#F5B800" stroke-width="1.6" opacity="0.85"/>
      <line x1="40" y1="0" x2="245" y2="0" stroke="#F5B800" stroke-width="1.6" opacity="0.85"/>
      <polygon points="0,-8 10,0 0,8 -10,0" fill="#F5B800"/>
      <polygon points="-24,-4 -15,0 -24,4 -33,0" fill="none" stroke="#F5B800" stroke-width="1.4"/>
      <polygon points="24,-4 33,0 24,4 15,0" fill="none" stroke="#F5B800" stroke-width="1.4"/>
    </g>

    <!-- Tagline -->
    <text x="600" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.6">
      <tspan fill="#FFFFFF">Where </tspan><tspan fill="#F5B800" font-weight="800">Students</tspan><tspan fill="#FFFFFF"> Lead Media</tspan>
    </text>
    <text x="600" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#94A3B8">
      SPEAK. NARRATE. DISCOVER. &bull; SNDMEDIA.IN &bull; @SNDSCHOOLMEDIA
    </text>
  </g>

  <!-- Right Pillar 1: SPECIAL REPORTS (Clipboard + Pie Chart + Pencil) -->
  <g transform="translate(918, 36)">
    <g fill="none" stroke="#F5B800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="32" height="42" rx="3" stroke="#F5B800"/>
      <rect x="16" y="4" width="12" height="6" rx="2" fill="#F5B800"/>
      <circle cx="17" cy="24" r="6" fill="#F5B800" opacity="0.9"/>
      <line x1="26" y1="20" x2="34" y2="20"/>
      <line x1="26" y1="27" x2="34" y2="27"/>
      <line x1="12" y1="36" x2="32" y2="36"/>
      <line x1="12" y1="42" x2="26" y2="42"/>
    </g>
    <text x="50" y="22" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">SPECIAL REPORTS</text>
    <text x="50" y="38" fill="#CBD5E1" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5">In-depth, inspiring.</text>
  </g>

  <!-- Right Pillar 2: STUDENT STORIES (3 Student Avatars + Grad Cap) -->
  <g transform="translate(918, 126)">
    <g fill="#F5B800">
      <!-- Grad cap above center student -->
      <polygon points="24,4 35,8 24,12 13,8"/>
      <!-- Center student -->
      <circle cx="24" cy="18" r="6"/>
      <path d="M13 44 C13 33, 35 33, 35 44 Z"/>
      <!-- Left & Right students -->
      <circle cx="10" cy="22" r="4.5" opacity="0.85"/>
      <path d="M2 44 C2 35, 16 35, 16 44 Z" opacity="0.85"/>
      <circle cx="38" cy="22" r="4.5" opacity="0.85"/>
      <path d="M32 44 C32 35, 46 35, 46 44 Z" opacity="0.85"/>
    </g>
    <text x="54" y="22" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">STUDENT STORIES</text>
    <text x="54" y="38" fill="#CBD5E1" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5">Written by Students, For Everyone.</text>
  </g>
</svg>
