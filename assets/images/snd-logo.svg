<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="SND Media Official Circular Crest Logo">
  <defs>
    <clipPath id="sndCircleClip">
      <circle cx="120" cy="120" r="110"/>
    </clipPath>
  </defs>
  <!-- White Circular Badge with Crisp Charcoal Border Ring -->
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#111827" stroke-width="6"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="#F5B800" stroke-width="1.5" opacity="0.45"/>

  <g clip-path="url(#sndCircleClip)" text-anchor="middle" font-family="'Arial Black', 'Impact', 'Segoe UI', sans-serif">
    <!-- Bold Geometric Monogram: S (charcoal) N (gold) D (charcoal) -->
    <text x="120" y="108" font-size="68" font-weight="900" letter-spacing="-2">
      <tspan fill="#111827">S</tspan><tspan fill="#F5B800">N</tspan><tspan fill="#111827">D</tspan>
    </text>
    <!-- Diagonal Geometric Accent Cut across 'N' -->
    <polygon points="103,60 113,60 137,108 127,108" fill="#F5B800" opacity="0.22"/>

    <!-- MEDIA Subheader -->
    <text x="120" y="138" font-size="25" font-weight="900" letter-spacing="4" fill="#111827" font-family="'Segoe UI', Arial, sans-serif">
      MEDIA
    </text>

    <!-- Thin Gold Divider -->
    <rect x="64" y="146" width="112" height="2" rx="1" fill="#F5B800"/>

    <!-- Motto Lines -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="8.2" font-weight="800" letter-spacing="0.9" fill="#1E293B">
      <text x="120" y="163">SPEAK. NARRATE. DISCOVER.</text>
      <text x="120" y="177">SHAPING NEW DREAMS</text>
      <text x="120" y="191">SHOOT. NARRATE. DIRECT.</text>
    </g>
  </g>
</svg>
